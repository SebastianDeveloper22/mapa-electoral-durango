<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Cartográfico | Durango</title>
    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- 1. El Mapa -->
    <div id="map"></div>

    <!-- Buscador Inteligente -->
<!-- Buscador Inteligente con Autocompletado -->
<!-- Buscador Inteligente con Filtro Numérico de Municipio -->
<!-- Buscador Inteligente Premium con 39 Municipios -->
<div id="search-container">
    <select id="search-municipio" class="premium-select">
        <option value="TODOS">Todo el Estado</option>
        <option value="1">Canatlán</option>
        <option value="2">Canelas</option>
        <option value="3">Coneto de Comonfort</option>
        <option value="4">Cuencamé</option>
        <option value="5">Durango</option>
        <option value="19">El Oro</option>
        <option value="7">Gómez Palacio</option>
        <option value="8">Guadalupe Victoria</option>
        <option value="9">Guanaceví</option>
        <option value="10">Hidalgo</option>
        <option value="11">Indé</option>
        <option value="12">Lerdo</option>
        <option value="13">Mapimí</option>
        <option value="14">Mezquital</option>
        <option value="15">Nazas</option>
        <option value="16">Nombre de Dios</option>
        <option value="17">Nuevo Ideal</option>
        <option value="18">Ocampo</option>
        <option value="20">Otáez</option>
        <option value="21">Pánuco de Coronado</option>
        <option value="22">Peñón Blanco</option>
        <option value="23">Poanas</option>
        <option value="24">Pueblo Nuevo</option>
        <option value="25">Rodeo</option>
        <option value="26">San Bernardo</option>
        <option value="27">San Dimas</option>
        <option value="28">San Juan de Guadalupe</option>
        <option value="29">San Juan del Río</option>
        <option value="30">San Luis del Cordero</option>
        <option value="31">San Pedro del Gallo</option>
        <option value="32">Santa Clara</option>
        <option value="33">Santiago Papasquiaro</option>
        <option value="6">Simón Bolívar</option>
        <option value="34">Súchil</option>
        <option value="35">Tamazula</option>
        <option value="36">Tepehuanes</option>
        <option value="37">Tlahualilo</option>
        <option value="38">Topia</option>
        <option value="39">Vicente Guerrero</option>
    </select>

    <select id="search-type" class="premium-select">
        <option value="seccion">Sección</option>
        <option value="colonia">Colonia</option>
        <option value="zona">Zona</option>
    </select>
    
    <div style="position: relative; display: flex; align-items: center;">
        <input type="text" id="search-input" autocomplete="off" placeholder="Ej: Centro...">
        <div id="autocomplete-list" class="autocomplete-items"></div>
    </div>
    
    <button id="btn-search">🔍</button>
</div>

    <!-- 2. Control de Capas (Colapsable por Hover) -->
    <div class="layer-control">
        <div class="layer-trigger">
            <span class="icon">🗺️</span>
            <span class="label">Capas</span>
        </div>
        <div id="layer-menu">
            <h3>Cartografía Electoral</h3>
            <label><input type="checkbox" id="check-municipio"> Municipios</label>
            <label><input type="checkbox" id="check-distrito-fed"> Distrito Federal</label>
            <label><input type="checkbox" id="check-distrito-local"> Distrito Local</label>
            <label><input type="checkbox" id="check-zona"> Zonas</label>
            <label><input type="checkbox" id="check-seccion"> Secciones</label>
            <label><input type="checkbox" id="check-colonia"> Colonias</label>
            <label><input type="checkbox" id="check-manzana"> Manzanas</label>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

            <h4 style="margin: 0 0 10px 0; color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">Marcadores PP</h4>
            <label><input type="checkbox" id="check-pin-2023" checked> Obras 2023</label>
            <label><input type="checkbox" id="check-pin-2024" checked> Obras 2024</label>
            <label><input type="checkbox" id="check-pin-2025" checked> Obras 2025</label>
            <label><input type="checkbox" id="check-pin-2026" checked> Obras 2026</label>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
    
            <!-- Opción para habilitar/deshabilitar texto -->
            <label style="color: var(--primary);">
                <input type="checkbox" id="check-show-labels" checked> 
                <b>Mostrar Etiquetas</b>
            </label>
        </div>
        </div>
    </div>

    <!-- 3. Botón Cerrar Sesión (Visible y elegante) -->
    <button id="btn-logout">Cerrar Sesión</button>

    <!-- 4. Pantalla de Login -->
    <div id="login-screen">
        <div class="login-card">
            <div class="logo-container">🗳️</div>
            <h2>Sistema Cartográfico</h2>
            <p>Introduce tus credenciales para acceder</p>

            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" placeholder="admin@mapa.com" required>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button id="btn-login">Entrar al Sistema</button>
        </div>
    </div>

    <!-- Scripts de Lógica -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/map.js"></script>
    <script type="module" src="js/pins.js"></script>

    <!-- MODAL DE REGISTRO DE OBRAS -->
<div id="pin-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3 style="margin-top:0; color: white;">📍 Registrar Obra P.P.</h3>
        
        <label class="modal-label">Nombre de la obra</label>
        <input type="text" id="pin-nombre" class="premium-input" placeholder="Ej. Parque Recreativo...">
        
        <label class="modal-label">Tipo de obra</label>
        <input type="text" id="pin-tipo" class="premium-input" placeholder="Ej. Pavimentación, Domo...">
        
        <label class="modal-label">Año (Generación)</label>
        <select id="pin-anio" class="premium-input">
            <option value="2023">2023</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
        </select>
        
        <div class="modal-actions">
            <button id="btn-cancel-pin" class="btn-cancel">Cancelar</button>
            <button id="btn-save-pin" class="btn-save">Guardar Obra</button>
        </div>
    </div>
</div>

</body>
</html>
