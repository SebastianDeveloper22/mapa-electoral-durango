<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartografía Electoral</title>
    
    <!-- Librería MapLibre GL JS (El motor ultrarrápido para tu mapa) -->
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Tus estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Pantalla de Login (Se ocultará al iniciar sesión) -->
    <div id="login-screen">
        <h2>Acceso al Sistema Cartográfico</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="btn-login">Ingresar</button>
    </div>

    <!-- Contenedor del Mapa (Oculto por defecto hasta hacer login) -->
    <div id="map-container" style="display: none;">
        <!-- Dentro de <div id="map-container"> -->
<div id="layer-menu">
    <h3>Capas</h3>
    <label><input type="checkbox" id="check-municipio" checked> Municipios</label>
    <label><input type="checkbox" id="check-distrito-fed" checked> Distrito Fed.</label>
    <label><input type="checkbox" id="check-distrito-local" checked> Distrito Local</label>
    <label><input type="checkbox" id="check-zona" checked> Zonas</label>
    <label><input type="checkbox" id="check-seccion" checked> Secciones</label>
    <label><input type="checkbox" id="check-colonia" checked> Colonias</label>
    <label><input type="checkbox" id="check-manzana" checked> Manzanas</label>
</div>
        <div id="map" style="width: 100vw; height: 100vh;"></div>
        <button id="btn-logout" style="position: absolute; top: 10px; right: 10px; z-index: 10;">Cerrar Sesión</button>
    </div>

    <!-- Firebase SDK (Versión modular más reciente) -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/map.js"></script>
    <script type="module" src="js/pins.js"></script>

</body>
</html>
